<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agents IA — Planning · Tâches · Email</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #18181f;
      --surface2: #22222c;
      --border: #2e2e3d;
      --text: #e8e8f0;
      --text-muted: #7a7a9a;
      --planning: #6c8ef5;
      --tasks: #52d68a;
      --email: #f5a623;
      --auto: #a78bfa;
      --radius: 14px;
      --font: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      padding: 16px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo span { color: var(--auto); }

    /* ── Agent tabs ── */
    .tabs {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }

    .tab {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .tab:hover { border-color: #444; color: var(--text); }

    .tab.active[data-agent="auto"]     { background: #2d1f5e; border-color: var(--auto);     color: var(--auto); }
    .tab.active[data-agent="planning"] { background: #1a2556; border-color: var(--planning); color: var(--planning); }
    .tab.active[data-agent="tasks"]    { background: #0f3323; border-color: var(--tasks);    color: var(--tasks); }
    .tab.active[data-agent="email"]    { background: #3d2800; border-color: var(--email);    color: var(--email); }

    .reset-btn {
      margin-left: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .reset-btn:hover { border-color: #f55; color: #f77; }

    /* ── Messages area ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Message bubbles ── */
    .msg { display: flex; gap: 10px; max-width: 780px; animation: fadeUp 0.2s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .msg.user { align-self: flex-end; flex-direction: row-reverse; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      background: var(--surface2);
    }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.6;
      font-size: 14.5px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user .bubble {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-top-right-radius: 4px;
    }

    .msg.agent .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
    }

    .msg .agent-tag {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }

    .agent-tag[data-agent="planning"] { color: var(--planning); }
    .agent-tag[data-agent="tasks"]    { color: var(--tasks); }
    .agent-tag[data-agent="email"]    { color: var(--email); }
    .agent-tag[data-agent="auto"]     { color: var(--auto); }

    /* ── Loading ── */
    .typing { display: flex; align-items: center; gap: 5px; padding: 14px 16px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); animation: bounce 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

    /* ── Input area ── */
    .input-area {
      padding: 16px 24px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-wrap {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      transition: border-color 0.15s;
    }

    .input-wrap:focus-within { border-color: var(--auto); }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 14.5px;
      line-height: 1.5;
      resize: none;
      max-height: 140px;
      min-height: 24px;
    }

    textarea::placeholder { color: var(--text-muted); }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: none;
      background: var(--auto);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .send-btn:hover { background: #8b6ff8; }
    .send-btn:disabled { background: var(--border); cursor: not-allowed; }

    .send-btn svg { width: 16px; height: 16px; }

    /* ── Welcome ── */
    .welcome {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      max-width: 480px;
    }

    .welcome h2 { font-size: 22px; color: var(--text); margin-bottom: 10px; }
    .welcome p  { font-size: 14px; line-height: 1.7; }

    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
    }

    .example {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface2);
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .example:hover { border-color: var(--auto); color: var(--text); }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      header { padding: 12px 16px; flex-wrap: wrap; }
      .tabs  { gap: 4px; }
      .tab   { padding: 6px 10px; font-size: 12px; }
      #messages { padding: 16px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🤖 <span>Agents</span> IA</div>
  <div class="tabs">
    <button class="tab active" data-agent="auto">⚡ Auto</button>
    <button class="tab" data-agent="planning">📅 Planning</button>
    <button class="tab" data-agent="tasks">✅ Tâches</button>
    <button class="tab" data-agent="email">✉️ Email</button>
  </div>
  <button class="reset-btn" id="resetBtn" title="Réinitialiser la conversation">↺ Reset</button>
</header>

<div id="messages">
  <div class="welcome" id="welcome">
    <h2>Bonjour 👋</h2>
    <p>Vos agents IA sont prêts. Parlez naturellement — le bon agent sera sélectionné automatiquement.</p>
    <div class="examples">
      <span class="example" onclick="send(this.textContent)">Ajoute une réunion lundi à 10h</span>
      <span class="example" onclick="send(this.textContent)">Mes tâches urgentes d'aujourd'hui</span>
      <span class="example" onclick="send(this.textContent)">Rédige un mail de relance client</span>
      <span class="example" onclick="send(this.textContent)">Réorganise mes priorités</span>
      <span class="example" onclick="send(this.textContent)">Créneaux libres demain pour 1h</span>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-wrap">
    <textarea id="input" placeholder="Écrivez votre message…" rows="1"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/>
      </svg>
    </button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('input');
  const sendBtn    = document.getElementById('sendBtn');
  const welcomeEl  = document.getElementById('welcome');
  let activeAgent  = 'auto';
  let loading      = false;

  const AGENT_META = {
    auto:     { label: 'Auto',     icon: '⚡' },
    planning: { label: 'Planning', icon: '📅' },
    tasks:    { label: 'Tâches',   icon: '✅' },
    email:    { label: 'Email',    icon: '✉️'  },
  };

  // ── Tabs ──────────────────────────────────────────────────
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      activeAgent = btn.dataset.agent;
    });
  });

  // ── Reset ─────────────────────────────────────────────────
  document.getElementById('resetBtn').addEventListener('click', async () => {
    const agent = activeAgent === 'auto' ? null : activeAgent;
    await fetch('/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ agent }),
    });
    document.querySelectorAll('.msg').forEach(m => m.remove());
    welcomeEl.style.display = '';
    addSystemMsg('Conversation réinitialisée.');
  });

  // ── Textarea auto-resize ───────────────────────────────────
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  });

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // ── Send ──────────────────────────────────────────────────
  function send(text) {
    inputEl.value = text;
    sendMessage();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || loading) return;

    welcomeEl.style.display = 'none';
    addMessage(text, 'user');
    inputEl.value = '';
    inputEl.style.height = 'auto';

    const typingEl = addTyping();
    setLoading(true);

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: text,
          agent: activeAgent === 'auto' ? null : activeAgent,
        }),
      });
      const data = await res.json();
      typingEl.remove();

      if (data.error) {
        addSystemMsg('Erreur : ' + data.error);
      } else {
        addMessage(data.response, 'agent', data.agent);
      }
    } catch (err) {
      typingEl.remove();
      addSystemMsg('Impossible de joindre le serveur. Vérifiez que server.py est lancé.');
    }

    setLoading(false);
  }

  // ── DOM helpers ───────────────────────────────────────────
  function addMessage(text, role, agentName) {
    const meta = agentName ? AGENT_META[agentName] || AGENT_META.auto : null;
    const div  = document.createElement('div');
    div.className = `msg ${role}`;

    if (role === 'agent') {
      div.innerHTML = `
        <div class="avatar">${meta.icon}</div>
        <div>
          <div class="agent-tag" data-agent="${agentName}">${meta.label}</div>
          <div class="bubble">${escHtml(text)}</div>
        </div>`;
    } else {
      div.innerHTML = `
        <div class="avatar">👤</div>
        <div class="bubble">${escHtml(text)}</div>`;
    }

    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'msg agent';
    div.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="bubble">
        <div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      </div>`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function addSystemMsg(text) {
    const div = document.createElement('div');
    div.style.cssText = 'text-align:center;color:#7a7a9a;font-size:12px;padding:4px 0;';
    div.textContent = text;
    messagesEl.appendChild(div);
  }

  function setLoading(state) {
    loading = state;
    sendBtn.disabled = state;
    inputEl.disabled = state;
  }

  function escHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/\n/g, '<br>');
  }
</script>
</body>
</html>
